<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#10141a"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="hl7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b48ff5" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#b48ff5" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="snomed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb1ee" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#5fb1ee" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="loinc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8c155" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#f8c155" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="release" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5fb1ee"/>
      <stop offset="50%"  stop-color="#f8c155"/>
      <stop offset="100%" stop-color="#b48ff5"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8d96a3"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="870" fill="url(#bg)"/>

  <!-- TITLE -->
  <text x="640" y="48" fill="#e6e9ef" font-size="22" font-weight="600" text-anchor="middle">
    Tri-organizational coordination behind LOINC Ontology 2.82 — March 2026
  </text>
  <text x="640" y="74" fill="#97a0ad" font-size="13" text-anchor="middle">
    How a Molecular-Tumor-Board content drop got built across HL7, SNOMED International, and Regenstrief/LOINC
  </text>

  <!-- THREE ORG NODES -->
  <!-- HL7 -->
  <g transform="translate(80,120)">
    <rect width="320" height="170" rx="10" fill="url(#hl7)" stroke="#b48ff5" stroke-width="1.5"/>
    <text x="20" y="32" fill="#b48ff5" font-size="11" font-weight="700" letter-spacing="1">USE-CASE DRIVER</text>
    <text x="20" y="58" fill="#e6e9ef" font-size="18" font-weight="600">HL7 International</text>
    <text x="20" y="90" fill="#c9cfd9" font-size="13">• mCODE — minimal Common Oncology</text>
    <text x="20" y="108" fill="#c9cfd9" font-size="13">  Data Elements</text>
    <text x="20" y="130" fill="#c9cfd9" font-size="13">• Genomics Reporting IG</text>
    <text x="20" y="152" fill="#c9cfd9" font-size="13">• CodeX Accelerator → MTB exchange</text>
  </g>

  <!-- SNOMED -->
  <g transform="translate(480,120)">
    <rect width="320" height="170" rx="10" fill="url(#snomed)" stroke="#5fb1ee" stroke-width="1.5"/>
    <text x="20" y="32" fill="#5fb1ee" font-size="11" font-weight="700" letter-spacing="1">COMPONENT AUTHOR</text>
    <text x="20" y="58" fill="#e6e9ef" font-size="18" font-weight="600">SNOMED International</text>
    <text x="20" y="90" fill="#c9cfd9" font-size="13">• Mints 121 antigen substances</text>
    <text x="20" y="108" fill="#c9cfd9" font-size="13">• Core-namespace SCTID block</text>
    <text x="20" y="126" fill="#c9cfd9" font-size="13" font-family="ui-monospace, Menlo, monospace">  1381232009 – 1381477009</text>
    <text x="20" y="152" fill="#c9cfd9" font-size="13">• Concept-model hierarchy maintenance</text>
  </g>

  <!-- LOINC -->
  <g transform="translate(880,120)">
    <rect width="320" height="170" rx="10" fill="url(#loinc)" stroke="#f8c155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8c155" font-size="11" font-weight="700" letter-spacing="1">OBSERVABLE AUTHOR</text>
    <text x="20" y="58" fill="#e6e9ef" font-size="18" font-weight="600">Regenstrief / LOINC</text>
    <text x="20" y="90" fill="#c9cfd9" font-size="13">• LOINC 2.82 ships new IHC terms</text>
    <text x="20" y="108" fill="#c9cfd9" font-size="13">• Builds 3,627 observable concepts</text>
    <text x="20" y="126" fill="#c9cfd9" font-size="13">• LOINC-Extension namespace SCTIDs</text>
    <text x="20" y="152" fill="#c9cfd9" font-size="13" font-family="ui-monospace, Menlo, monospace">  …1010000XXX</text>
  </g>

  <!-- ARROWS DOWN -->
  <g stroke="#8d96a3" stroke-width="1.5" fill="none" marker-end="url(#arr)" opacity=".7">
    <path d="M 240 290 L 240 360"/>
    <path d="M 640 290 L 640 360"/>
    <path d="M 1040 290 L 1040 360"/>
  </g>
  <text x="240" y="320" fill="#97a0ad" font-size="11" text-anchor="middle">term requests</text>
  <text x="640" y="320" fill="#97a0ad" font-size="11" text-anchor="middle">substance minting</text>
  <text x="1040" y="320" fill="#97a0ad" font-size="11" text-anchor="middle">term publication</text>

  <!-- CENTRAL RELEASE ARTIFACT -->
  <g transform="translate(80, 360)">
    <rect width="1120" height="150" rx="10" fill="#1a1f27" stroke="url(#release)" stroke-width="2"/>
    <text x="30" y="34" fill="#e6e9ef" font-size="11" font-weight="700" letter-spacing="1">JOINT RELEASE</text>
    <text x="30" y="68" fill="#e6e9ef" font-size="22" font-weight="600">LOINC Ontology 2.82</text>
    <text x="30" y="96" fill="#97a0ad" font-size="13">Module 11010000107 (LOINC Extension)</text>
    <text x="30" y="116" fill="#97a0ad" font-size="13">effectiveTime 20260321</text>
    <text x="30" y="136" fill="#97a0ad" font-size="13">aligned with SNOMED CT International 2026-01-01</text>
    <!-- right-hand stats column -->
    <g transform="translate(720, 28)">
      <text x="0" y="14" fill="#97a0ad" font-size="11" letter-spacing="1" font-weight="600">SHIPPED</text>
      <text x="0" y="46" fill="#5fd07e" font-size="26" font-weight="600">+8,581</text>
      <text x="108" y="46" fill="#c9cfd9" font-size="13">concepts added</text>
      <text x="0" y="76" fill="#5fb1ee" font-size="13">121 substances · SNOMED-minted</text>
      <text x="0" y="96" fill="#f8c155" font-size="13">3,627 observables · LOINC-minted</text>
    </g>
  </g>

  <!-- ARROW DOWN to content -->
  <path d="M 640 510 L 640 540" stroke="#8d96a3" stroke-width="1.5" fill="none" marker-end="url(#arr)" opacity=".7"/>

  <!-- CONTENT GRID — MTB-RELEVANT BIOMARKERS -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" fill="#e6e9ef" font-size="14" font-weight="600">Molecular-Tumor-Board content fingerprint</text>
    <text x="0" y="18" fill="#97a0ad" font-size="11">New SNOMED Components paired with new LOINC observables — all effectiveTime 20260321</text>

    <g transform="translate(0, 38)" font-size="12">
      <!-- 5 cols x 2 rows of biomarker chips -->
      <g>
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">Estrogen receptor</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">breast cancer · 1381324003</text>
      </g>
      <g transform="translate(225, 0)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">Progesterone receptor</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">breast cancer · 1381419002</text>
      </g>
      <g transform="translate(450, 0)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">HER2 / erbB-2</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">8 observables · 1381347002</text>
      </g>
      <g transform="translate(675, 0)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">Androgen receptor</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">prostate cancer · 1381244007</text>
      </g>
      <g transform="translate(900, 0)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">Ki-67 proliferation</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">cell-fraction modeling</text>
      </g>

      <g transform="translate(0, 60)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">BRAF wild-type</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">1381425003</text>
      </g>
      <g transform="translate(225, 60)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">BRAF V600E variant</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">actionable · 1381439003</text>
      </g>
      <g transform="translate(450, 60)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">ALK kinase</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">NSCLC · 1381243001</text>
      </g>
      <g transform="translate(675, 60)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">Lynch MMR panel</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">MLH1·MSH2·MSH6·PMS2…</text>
      </g>
      <g transform="translate(900, 60)">
        <rect width="210" height="48" rx="6" fill="#232a34" stroke="#2c3340"/>
        <text x="14" y="20" fill="#f8c155" font-weight="600">p53 / BCL2 / EGFR</text>
        <text x="14" y="38" fill="#97a0ad" font-size="11">prognosis · apoptosis</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM ANNOTATIONS — TWO MODELING PATTERNS -->
  <g transform="translate(80, 740)">
    <rect width="540" height="90" rx="8" fill="#161b22" stroke="#2c3340"/>
    <text x="20" y="26" fill="#5fb1ee" font-size="11" font-weight="700" letter-spacing="1">PATTERN A — PRESENCE / CONCENTRATION</text>
    <text x="20" y="48" fill="#c9cfd9" font-size="12">Component = «Antigen of X»  (substance)</text>
    <text x="20" y="66" fill="#c9cfd9" font-size="12">Property  = Presence / Mass concentration / Arb conc</text>
    <text x="20" y="82" fill="#97a0ad" font-size="11">ER · PR · HER2 · AR · p53 · BRAF · ALK · Lynch · BCL2</text>
  </g>
  <g transform="translate(660, 740)">
    <rect width="540" height="90" rx="8" fill="#161b22" stroke="#2c3340"/>
    <text x="20" y="26" fill="#f8c155" font-size="11" font-weight="700" letter-spacing="1">PATTERN B — CELL FRACTION</text>
    <text x="20" y="48" fill="#c9cfd9" font-size="12">Component = «Cell positive for X antigen»  (cell)</text>
    <text x="20" y="66" fill="#c9cfd9" font-size="12">Property  = Number fraction  ·  Relative to = Cell</text>
    <text x="20" y="82" fill="#97a0ad" font-size="11">Ki-67 proliferation index · other stained-cell-count assays</text>
  </g>

  <!-- footer -->
  <text x="640" y="855" fill="#5a6675" font-size="10" text-anchor="middle">
    Source: full diff of MAIN/LOINC/2025-09-21 → MAIN/SNOMEDCT-LOINC/2026-03-21  ·  loincsnomed.org/notes  ·  effectiveTime evidence
  </text>
</svg>
